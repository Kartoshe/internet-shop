<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация - Интернет-магазин</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-form">
      <h1>Регистрация</h1>
      
      <form id="register-form">
        <div class="form-group">
          <label for="name">ФИО</label>
          <input type="text" id="name" required>
        </div>
        
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required>
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password" id="password" required minlength="6">
          </div>
          
          <div class="form-group">
            <label for="confirm-password">Подтвердите пароль</label>
            <input type="password" id="confirm-password" required minlength="6">
          </div>
        </div>

        <div class="form-group">
          <label for="phone">Телефон</label>
          <input type="tel" id="phone" placeholder="+7 (XXX) XXX-XX-XX">
        </div>
        
        <div class="form-group">
          <label for="address">Адрес</label>
          <textarea id="address" rows="2"></textarea>
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label for="birth-date">Дата рождения</label>
            <input type="date" id="birth-date">
          </div>
          
          <div class="form-group">
            <label>Пол</label>
            <div class="radio-group">
              <label>
                <input type="radio" name="gender" value="male"> Мужской
              </label>
              <label>
                <input type="radio" name="gender" value="female"> Женский
              </label>
            </div>
          </div>
        </div>

        <button type="submit" class="btn">Зарегистрироваться</button>
      </form>
      
      <div class="auth-links">
        <p>Уже есть аккаунт? <a href="login.html">Войдите</a></p>
        <p><a href="index.html">Вернуться на главную</a></p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm-password').value;
        const phone = document.getElementById('phone').value;
        const address = document.getElementById('address').value;
        const birthDate = document.getElementById('birth-date').value;
        const gender = document.querySelector('input[name="gender"]:checked')?.value;

        if (password !== confirmPassword) {
          alert('Пароли не совпадают');
          return;
        }
        
        try {
          const response = await fetch('http://localhost:3000/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password, name, phone: phone || null,
              address: address || null, birth_date: birthDate || null, gender: gender || null })
          });
          
          if (!response.ok) {
            const error = await response.json();
            throw new Error(error.error || 'Ошибка регистрации');
          }
          
          const user = await response.json();
          alert(`Регистрация успешна! Добро пожаловать, ${user.name || user.email}`);
          window.location.href = 'login.html';
        } catch (err) {
          alert(err.message);
        }
      });
    });
  </script>
</body>
</html>
