<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход - Интернет-магазин</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="cookieConsent" style="display:none; position:fixed; bottom:0; width:100%; background:#f5f5f5; padding:10px; text-align:center; z-index:1000;">
    <p>Мы используем cookies для улучшения работы сайта. Продолжая, вы соглашаетесь с нашей <a href="privacy.html">политикой конфиденциальности</a>.</p>
    <button id="acceptCookies">Принять</button>
    <button id="rejectCookies">Отклонить</button>
  </div>
  
  <div class="auth-container">
    <div class="auth-form">
      <h1>Вход в аккаунт</h1>
      
      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required>
        </div>
        
        <div class="form-group">
          <label for="password">Пароль</label>
          <input type="password" id="password" required>
        </div>
        
        <button type="submit" class="btn">Войти</button>
      </form>
      
      <div class="auth-links">
        <p>Нет аккаунта? <a href="register.html">Зарегистрируйтесь</a></p>
        <p><a href="index.html">Вернуться на главную</a></p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        try {
          const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ email, password })
          });
          
          if (!response.ok) {
            const error = await response.json();
            throw new Error(error.error || 'Ошибка входа');
          }
          
          const { user } = await response.json();
          alert(`Добро пожаловать, ${user.name || user.email}!`);
          window.location.href = 'account.html';
        } catch (err) {
          alert(err.message);
        }
      });
    });
  </script>
</body>
</html>
